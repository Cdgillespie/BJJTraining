<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#18231f">
<title>My Training</title>
<style>
:root{--ink:#1d2b26;--muted:#69766f;--paper:#f5f5ef;--card:#fff;--line:#e4e8df;--green:#345d4b;--sage:#e5eee7;--gold:#d6a85c;--red:#a24d45;--shadow:0 12px 32px #1c30200c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1050px;margin:auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:21px}.brand h1{font-size:21px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;background:#e9ece5;padding:5px;border-radius:13px;flex-wrap:wrap}nav button{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:9px;font-size:13px;font-weight:650}nav button.active{background:white;color:var(--ink);box-shadow:0 2px 8px #0000000b}
h2{font-size:26px;letter-spacing:-.8px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow)}.card h3{margin:0 0 14px;font-size:16px}.hero{background:var(--green);color:white;border-radius:20px;padding:22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero .eyebrow{color:#c9d9ce;font-size:11px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase}.hero h2{font-size:28px;margin:4px 0}.hero p{color:#d8e4dc;margin:0;font-size:13px}.date-tools{display:flex;align-items:center;gap:8px}.date-tools button{border:1px solid #ffffff45;background:#ffffff12;color:white;border-radius:9px;padding:8px 11px}.date-tools input{width:142px;background:#ffffff12;color:white;border:1px solid #ffffff45;border-radius:9px;padding:8px;color-scheme:dark}
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0;padding-bottom:0}.task input{accent-color:var(--green);width:19px;height:19px;margin:2px 0 0}.task-title{font-weight:700}.task-meta{font-size:12px;color:var(--muted);margin-top:3px}.task.done .task-title{text-decoration:line-through;color:#87918a}.tag{display:inline-block;font-size:10px;font-weight:750;letter-spacing:.4px;text-transform:uppercase;background:var(--sage);color:var(--green);padding:4px 7px;border-radius:6px;margin-left:6px}
.progress{height:8px;background:#e9eee8;border-radius:99px;overflow:hidden;margin:9px 0 5px}.progress span{display:block;height:100%;background:#6b9477;border-radius:99px;transition:width .2s}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f7f8f4;border-radius:13px;padding:13px}.stat strong{font-size:24px;display:block}.stat small{color:var(--muted);font-size:11px}
.btn{border:0;background:var(--green);color:white;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px}.btn.secondary{background:var(--sage);color:var(--green)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#f8eae8;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 15px}
.day-list{display:grid;gap:10px}.day{display:grid;grid-template-columns:105px 1fr auto;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:white}.day-name{font-weight:750}.day-items{font-size:13px;color:var(--muted)}.day .actions{justify-content:flex-end}
.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:750;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:white;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:28px 15px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}
.library-item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.library-item:last-child{border:0}.library-item strong{display:block}.library-item small{color:var(--muted)}
.week-nav{display:flex;align-items:center;gap:8px}.week-nav button{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 10px}.notice{background:#f8f3e8;border:1px solid #eee2c9;border-radius:12px;padding:12px 14px;color:#75613d;font-size:12px;margin-top:14px}
footer{text-align:center;color:#87918a;font-size:11px;margin-top:28px}
@media(max-width:720px){.app{padding:16px 13px 45px}header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.day{grid-template-columns:82px 1fr}.day .actions{grid-column:2;justify-content:flex-start}.form-grid{grid-template-columns:1fr}.date-tools input{width:130px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="mark">✦</div><div><h1>My Training</h1><p>Your routine. Your pace. Your progress.</p></div></div>
 <nav id="nav"><button class="active" data-view="today">Today</button><button data-view="schedule">Schedule</button><button data-view="library">Workout library</button><button data-view="progress">Progress</button></nav>
</header>
<main id="main"></main>
<footer>Your information is saved in this browser on this device. Export a backup regularly.</footer>
</div>
<script>
const KEY='my-training-v1';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TYPES=['BJJ','Strength','Run / Walk','Cardio','Dynamic warm-up','Stretching','Mobility','Recovery','Other'];
let state=load(), view='today', selectedDate=iso(new Date()), editingId=null;
function fresh(){return {schedule:[],library:[],checks:{},notes:{}}}
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateObj(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pretty(s){return dateObj(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function tasksFor(date){let d=dateObj(date).getDay();return state.schedule.filter(x=>x.day===d).sort((a,b)=>(a.order||0)-(b.order||0))}
function checked(date,id){return !!(state.checks[date]||{})[id]}
function setCheck(date,id,v){state.checks[date]??={};state.checks[date][id]=v;save();render()}
function setView(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-view]');if(b)setView(b.dataset.view)});
function render(){let main=document.getElementById('main'); if(view==='today')main.innerHTML=today();if(view==='schedule')main.innerHTML=schedule();if(view==='library')main.innerHTML=library();if(view==='progress')main.innerHTML=progress();bind()}
function today(){let tasks=tasksFor(selectedDate),done=tasks.filter(t=>checked(selectedDate,t.id)).length,pct=tasks.length?Math.round(done/tasks.length*100):0;
return `<div class="hero"><div><div class="eyebrow">Daily training plan</div><h2>${pretty(selectedDate)}</h2><p>${tasks.length?`${tasks.length} planned activities · ${done} completed`:'No activities scheduled yet. Add your repeating routine in Schedule.'}</p></div><div class="date-tools"><button id="prev">‹</button><input id="datepick" type="date" value="${selectedDate}"><button id="next">›</button><button id="todayBtn">Today</button></div></div>
<div class="grid"><section class="card"><div class="section-head"><h3>Today's checklist</h3><span class="muted" style="font-size:12px">${pct}% complete</span></div><div class="progress"><span style="width:${pct}%"></span></div>${tasks.length?tasks.map(t=>`<label class="task ${checked(selectedDate,t.id)?'done':''}"><input type="checkbox" data-check="${t.id}" ${checked(selectedDate,t.id)?'checked':''}><span style="flex:1"><span class="task-title">${esc(t.title)} <span class="tag">${esc(t.type)}</span></span><div class="task-meta">${[t.duration,t.details].filter(Boolean).map(esc).join(' · ')}</div></span></label>`).join(''):`<div class="empty"><strong>Your day starts here</strong>Add recurring activities to your weekly schedule. You can include BJJ, strength sessions, running, warm-ups, stretching, and rest days.</div>`}
<div class="section-head" style="margin-top:17px"><h3 style="margin:0">Daily notes</h3></div><textarea id="dayNote" class="field" style="width:100%;min-height:75px;border:1px solid var(--line);border-radius:10px;padding:10px" placeholder="Energy, soreness, how training felt...">${esc(state.notes[selectedDate]||'')}</textarea><div class="actions"><button class="btn secondary" id="saveNote">Save note</button></div></section>
<aside class="card"><h3>Day at a glance</h3><div class="stats"><div class="stat"><strong>${tasks.length}</strong><small>Planned activities</small></div><div class="stat"><strong>${done}</strong><small>Completed</small></div></div><div style="margin-top:18px"><h3>Training tip</h3><p class="muted" style="font-size:13px;margin:0">Use your notes to spot patterns in energy and recovery. A completed checklist is useful, but recovery matters just as much as consistency.</p></div><div class="notice">Your weekly schedule repeats automatically. Checking off today's activity won't change another day's checklist.</div></aside></div>`}
function schedule(){let rows=DAYS.map((day,i)=>{let items=state.schedule.filter(x=>x.day===i);return `<div class="day"><div class="day-name">${day}</div><div class="day-items">${items.length?items.map(x=>`${esc(x.title)} <span class="tag">${esc(x.type)}</span>`).join('<br>'):'Rest / no activities planned'}</div><div class="actions"><button class="btn secondary" data-add-day="${i}">＋ Add</button></div></div>`}).join('');
return `<h2>Weekly schedule</h2><p class="sub">Set your routine once. It repeats every week until you edit it.</p><div class="section-head"><h3>Repeating days</h3><button class="btn" id="addActivity">＋ Add activity</button></div><div class="day-list">${rows}</div><div class="notice">Edits apply to future views of the repeating schedule. Your past completion history stays saved.</div><div id="editor"></div>`}
function editorForm(day=null,item=null){let x=item||{};return `<section class="card" style="margin-top:16px" id="editCard"><div class="section-head"><h3>${item?'Edit activity':'Add recurring activity'}</h3><button class="btn ghost" id="closeEditor">Close</button></div><form id="activityForm"><div class="form-grid"><div class="field"><label>Activity name</label><input name="title" required maxlength="70" placeholder="e.g. BJJ class, Strength A" value="${esc(x.title||'')}"></div><div class="field"><label>Type</label><select name="type">${TYPES.map(t=>`<option ${x.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Repeats on</label><select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${(x.day??day)===i?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Duration (optional)</label><input name="duration" placeholder="e.g. 20–25 min" value="${esc(x.duration||'')}"></div></div><div class="field"><label>Instructions / details (optional)</label><textarea name="details" placeholder="Exercises, sets, reps, pace, stretches, class focus...">${esc(x.details||'')}</textarea></div><div class="actions"><button class="btn" type="submit">Save activity</button>${item?'<button class="btn danger" type="button" id="deleteActivity">Delete</button>':''}</div></form></section>`}
function library(){return `<h2>Workout library</h2><p class="sub">Save reusable workout routines and exercise instructions here.</p><div class="grid"><section class="card"><div class="section-head"><h3>My routines</h3><button class="btn" id="addRoutine">＋ Add routine</button></div><div id="routineList">${state.library.length?state.library.map((x,i)=>`<div class="library-item"><div><strong>${esc(x.name)}</strong><small>${esc(x.type)}${x.duration?' · '+esc(x.duration):''}<br>${esc(x.details||'No instructions added')}</small></div><button class="btn ghost" data-edit-routine="${i}">Edit</button></div>`).join(''):'<div class="empty"><strong>No saved routines yet</strong>Add your strength workouts, warm-ups, stretching sequences, or BJJ drills.</div>'}</div></section><section class="card"><h3>How to use this section</h3><p class="muted" style="font-size:13px">Keep the detailed instructions for each routine here. Then add that routine's name and a short reminder to the repeating schedule. You can store sets, reps, rest periods, and exercise order in the instructions.</p><div class="notice">The library and schedule are editable independently, so you can update a routine without losing your training history.</div></section></div><div id="routineEditor"></div>`}
function progress(){let days=Object.keys(state.checks).sort(),total=0,done=0;days.forEach(d=>{let n=tasksFor(d);total+=n.length;done+=n.filter(t=>checked(d,t.id)).length});let recent=days.slice(-7).reverse();return `<h2>Progress</h2><p class="sub">A simple record of consistency, not a scorecard.</p><div class="grid"><section class="card"><h3>Overall completion</h3><div class="stats"><div class="stat"><strong>${done}</strong><small>Activities completed</small></div><div class="stat"><strong>${total?Math.round(done/total*100):0}%</strong><small>Completion rate</small></div></div><div class="progress" style="margin-top:18px"><span style="width:${total?done/total*100:0}%"></span></div></section><section class="card"><h3>Recent training days</h3>${recent.length?recent.map(d=>{let ts=tasksFor(d),n=ts.filter(t=>checked(d,t.id)).length;return `<div class="library-item"><div><strong>${pretty(d)}</strong><small>${n} of ${ts.length} activities completed</small></div><button class="btn ghost" data-open-date="${d}">View</button></div>`}).join(''):'<div class="empty">Your completed sessions will appear here.</div>'}</section></div><div class="actions" style="margin-top:16px"><button class="btn secondary" id="export">Export backup (JSON)</button><button class="btn ghost" id="importBtn">Import backup</button><input type="file" id="importFile" accept="application/json" hidden></div><p class="muted" style="font-size:12px;margin-top:10px">Progress is stored locally in this browser. Export a backup before clearing browser data or switching devices.</p>`}
function bind(){
document.getElementById('prev')?.addEventListener('click',()=>moveDate(-1));document.getElementById('next')?.addEventListener('click',()=>moveDate(1));document.getElementById('todayBtn')?.addEventListener('click',()=>{selectedDate=iso(new Date());render()});document.getElementById('datepick')?.addEventListener('change',e=>{selectedDate=e.target.value||iso(new Date());render()});
document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>setCheck(selectedDate,el.dataset.check,el.checked)));
document.getElementById('saveNote')?.addEventListener('click',()=>{state.notes[selectedDate]=document.getElementById('dayNote').value;save();alert('Note saved.')});
document.getElementById('addActivity')?.addEventListener('click',()=>showEditor());document.querySelectorAll('[data-add-day]').forEach(b=>b.addEventListener('click',()=>showEditor(Number(b.dataset.addDay))));
document.querySelectorAll('[data-edit-routine]').forEach(b=>b.addEventListener('click',()=>showRoutineEditor(Number(b.dataset.editRoutine))));
document.getElementById('addRoutine')?.addEventListener('click',()=>showRoutineEditor());
document.querySelectorAll('[data-open-date]').forEach(b=>b.addEventListener('click',()=>{selectedDate=b.dataset.openDate;setView('today')}));
document.getElementById('export')?.addEventListener('click',exportData);document.getElementById('importBtn')?.addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile')?.addEventListener('change',importData);
}
function moveDate(n){let d=dateObj(selectedDate);d.setDate(d.getDate()+n);selectedDate=iso(d);render()}
function showEditor(day=null,item=null){let el=document.getElementById('editor');el.innerHTML=editorForm(day,item);document.getElementById('closeEditor').onclick=()=>el.innerHTML='';document.getElementById('activityForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:item?.id||crypto.randomUUID(),title:f.get('title').trim(),type:f.get('type'),day:Number(f.get('day')),duration:f.get('duration').trim(),details:f.get('details').trim(),order:Date.now()};if(item)state.schedule=state.schedule.map(x=>x.id===item.id?obj:x);else state.schedule.push(obj);save();render();};document.getElementById('deleteActivity')?.addEventListener('click',()=>{if(confirm('Delete this repeating activity?')){state.schedule=state.schedule.filter(x=>x.id!==item.id);save();render()}});el.scrollIntoView({behavior:'smooth',block:'start'})}
function showRoutineEditor(index=null){let el=document.getElementById('routineEditor'),item=index===null?null:state.library[index];el.innerHTML=`<section class="card" style="margin-top:16px"><div class="section-head"><h3>${item?'Edit routine':'New routine'}</h3><button class="btn ghost" id="closeRoutine">Close</button></div><form id="routineForm"><div class="form-grid"><div class="field"><label>Routine name</label><input name="name" required value="${esc(item?.name||'')}" placeholder="e.g. Strength A"></div><div class="field"><label>Type</label><select name="type">${TYPES.map(t=>`<option ${item?.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label>Duration</label><input name="duration" value="${esc(item?.duration||'')}" placeholder="e.g. 20 minutes"></div><div class="field"><label>Exercises and instructions</label><textarea name="details" placeholder="1. Goblet squat — 3 x 10&#10;2. Push-up — 3 x 8&#10;Rest 60 seconds between sets">${esc(item?.details||'')}</textarea></div><div class="actions"><button class="btn">Save routine</button>${item?'<button class="btn danger" type="button" id="deleteRoutine">Delete</button>':''}</div></form></section>`;document.getElementById('closeRoutine').onclick=()=>el.innerHTML='';document.getElementById('routineForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={name:f.get('name').trim(),type:f.get('type'),duration:f.get('duration').trim(),details:f.get('details').trim()};if(index===null)state.library.push(o);else state.library[index]=o;save();render()};document.getElementById('deleteRoutine')?.addEventListener('click',()=>{if(confirm('Delete this saved routine?')){state.library.splice(index,1);save();render()}});el.scrollIntoView({behavior:'smooth',block:'start'})}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-training-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.schedule)||!Array.isArray(x.library))throw Error();if(confirm('Replace the current app data with this backup?')){state={...fresh(),...x};save();render()}}catch{alert('That file does not look like a My Training backup.')}};r.readAsText(file);e.target.value=''}
render();
</script>
</body>
</html>
